apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolyard
  labels:
    app.kubernetes.io/name: toolyard
    app.kubernetes.io/component: gateway
spec:
  # One gateway per database: passkey ceremonies, the realtime hub, waiters
  # and rate limits live in process memory, and background loops (sweepers,
  # Telegram long-poll) must not run twice.
  replicas: 1
  # Recreate, not RollingUpdate: the default maxSurge would start a second
  # pod next to the old one.
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: toolyard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toolyard
        app.kubernetes.io/component: gateway
    spec:
      # The drain needs up to 60 s (-drain-timeout) plus ~10 s of bounded
      # closes after SIGTERM.
      terminationGracePeriodSeconds: 75
      # toolyard calls no Kubernetes API.
      automountServiceAccountToken: false
      # No <SERVICE>_PORT / <SERVICE>_SERVICE_HOST variables: a Service named
      # toolyard would inject TOOLYARD_* variables next to the real settings.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        # The code-mode sandbox (Landlock + seccomp, no capabilities needed)
        # works under the container runtime's default seccomp profile.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toolyard
          image: ghcr.io/iamtushar324/toolyard
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8787
            - name: ops
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: toolyard-config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Both addresses are private, so the ops listener needs no token.
            # (An IPv6 pod IP needs brackets: [$(POD_IP)]:9090.)
            - name: TOOLYARD_OPS_ADDR
              value: "127.0.0.1:9090,$(POD_IP):9090"
            # A dedicated path: /run/secrets can clash with the service
            # account token mount (/var/run is a link to /run).
            - name: TOOLYARD_CREDENTIALS_DIR
              value: /etc/toolyard/credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          # The main listener opens only once startup (database, keys,
          # upstream loading) is done; allow up to 3 minutes.
          startupProbe:
            httpGet:
              path: /v1/livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          # Liveness reads nothing, the database included: a database outage
          # must not restart the pod.
          livenessProbe:
            httpGet:
              path: /v1/livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness turns 503 while draining, before keys are verified and
          # when the database fails two pings in a row.
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # Keep the limit well above GOMEMLIMIT plus four script workers
            # (RLIMIT_DATA 256 MiB each), so a worker's own limit acts before
            # a cgroup OOM kill, which takes the whole container on cgroup v2.
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/toolyard/data
            - name: tmp
              mountPath: /tmp
            - name: credentials
              mountPath: /etc/toolyard/credentials
              readOnly: true
            - name: db-ca
              mountPath: /etc/toolyard/db-ca
              readOnly: true
      volumes:
        # On Postgres the data directory holds only crash dumps, the
        # model-price cache and temporary files for uploads (up to 50 MiB
        # each), so it can be disposable. Disk-backed, not memory.
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        # identity.key, oauth.key, secrets.key, session.key, database-url
        # and optionally toolyard.env. Create it before the first start
        # (see ../README.md).
        - name: credentials
          secret:
            secretName: toolyard-credentials
            defaultMode: 0440
        # Optional CA bundle for sslmode=verify-full: reference it from the
        # database URL as sslrootcert=/etc/toolyard/db-ca/ca.pem.
        - name: db-ca
          configMap:
            name: toolyard-db-ca
            optional: true
