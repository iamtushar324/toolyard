# Headless: the StatefulSet's governing Service. The name resolves to the
# Postgres pod's address once it is ready; database-url uses
# toolyard-postgres:5432.
apiVersion: v1
kind: Service
metadata:
  name: toolyard-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
