# Postgres 16 for the HA test deployment: one StatefulSet replica on a
# persistent volume, reachable only from the gateway and the migration Job.
# For testing only: no backups, no replication, no TLS inside the cluster.
#
# It needs the toolyard-postgres Secret (key "password"); the deploy script
# creates it once, together with toolyard-credentials, whose database-url
# holds the same password.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: toolyard
    includeSelectors: false
    includeTemplates: true
