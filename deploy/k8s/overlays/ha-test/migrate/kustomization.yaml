# The schema migration (`toolyard db migrate`) as a Job, with the gateway's
# image and toolyard-credentials Secret. A Job's pod template is immutable,
# so scripts/k8s-test-deploy.sh deletes the previous Job and applies this
# one before every rollout. The gateway runs with TOOLYARD_MIGRATE=off and
# refuses to start (exit 78) on a schema that is behind its binary.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - job.yaml
  - networkpolicy.yaml

# Pin the same image as the gateway; the deploy script sets IMAGE here and
# in app/ alike.
images:
  - name: ghcr.io/iamtushar324/toolyard
    newTag: main

labels:
  - pairs:
      app.kubernetes.io/part-of: toolyard
    includeSelectors: false
    includeTemplates: true
