# The toolyard gateway for the HA test deployment: the reference base with
# two replicas, rolling updates, spreading, a PodDisruptionBudget, an
# Ingress and NetworkPolicies. The database URL comes from the
# toolyard-credentials Secret (database-url), as in the base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base
  - pdb.yaml
  - ingress.yaml
  - networkpolicy.yaml

patches:
  - path: deployment-patch.yaml

# Test overrides on top of base/config.env. The deploy script merges the
# public URL, the trusted proxy and the owner email in the same way.
configMapGenerator:
  - name: toolyard-config
    behavior: merge
    envs:
      - config.env

labels:
  - pairs:
      app.kubernetes.io/part-of: toolyard
    includeSelectors: false
    includeTemplates: true
