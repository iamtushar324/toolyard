# Datasource provisioning for toolyard-grafana.
#
# Loaded once on container start and reconciled on every restart. Edits
# made via the Grafana UI to a provisioned datasource get overwritten
# on the next start, so this file is the source of truth.
#
# Env interpolation: Grafana provisioning expands `$VAR_NAME` (or
# `${VAR_NAME}`) at load time using the container's environment. NOTE:
# the `$__env{...}` form is for *dashboard* template variables, NOT
# provisioning, and gets stored as a literal string here — leading to a
# very confusing "failed to create ClickHouse client" because the plugin
# tries to authenticate with the literal password "$__env{...}".
# Vars come from /var/lib/toolyard/clickhouse-runtime.env (TOOLYARD_CH_PASSWORD,
# rotated by toolyard) and /etc/toolyard/toolyard.env (operator-managed)
# via the env_file directive in docker-compose.yaml.

apiVersion: 1

datasources:
  # Toolyard Lake — ClickHouse warehouse reached over the shared
  # `toolyard_lake_net` docker network, native TCP protocol on 9000.
  # No gateway hop in this path: panels query CH directly. The user
  # is the same `default` CH user the gateway uses; password is rotated
  # by toolyard and surfaced here via TOOLYARD_CH_PASSWORD.
  - name: Toolyard Lake
    uid: toolyard-lake
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      # `clickhouse` is the docker service name from the CH compose; the
      # shared external network gives Grafana a DNS entry for it.
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: default
      # `defaultDatabase` is the implicit database for unqualified table
      # references. Dashboards use fully qualified `db.table` everywhere
      # so this is mostly cosmetic — pointed at `mart` since that's
      # where the dim/fact tables live.
      defaultDatabase: mart
      tlsSkipVerify: false
    secureJsonData:
      password: "$TOOLYARD_CH_PASSWORD"

  # Nova SQLite (legacy). Carried over so any dashboard that hasn't been
  # ported yet still works against the original nova.db file. Remove
  # once every panel queries Toolyard Lake.
  - name: Nova SQLite
    uid: nova-sqlite
    type: frser-sqlite-datasource
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      path: /var/lib/grafana/nova-data/nova.db
