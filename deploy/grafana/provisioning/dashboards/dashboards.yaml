# Dashboard provider for toolyard-grafana.
#
# Tells Grafana to scan /var/lib/grafana/dashboards/ on startup and load
# any *.json file there as a provisioned dashboard. The path is bind-
# mounted to deploy/grafana/dashboards/ in the repo, so dashboards are
# version-controlled and re-loaded on container restart.
#
# editable: true means panels can be tweaked in the UI for ad-hoc
# exploration, but provider reload still wins on restart — treat the
# JSONs in the repo as authoritative and commit any UI changes back.

apiVersion: 1

providers:
  - name: Toolyard Dashboards
    orgId: 1
    folder: Toolyard
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
