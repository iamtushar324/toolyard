# toolyard-clickhouse — analytical SQL server for the personal data lake.
#
# Sits alongside the gateway (systemd) and the Grafana stack (sibling
# compose). Today it serves nothing yet — this file just stands the
# server up. Ingest from the DuckDB lake and a Grafana datasource entry
# come in follow-up changes.
#
# Storage: bind-mount under /var/lib/toolyard/clickhouse/ so the same
# `tar czf backup.tgz /var/lib/toolyard/` picks it up alongside the
# SQLite control plane and the DuckDB lake. Bind dirs are chowned to
# uid 101 (the clickhouse user inside the image) by deploy/install.sh
# before the container starts.
#
# Auth: TOOLYARD_CH_PASSWORD is generated by install.sh on first run and
# persisted at /var/lib/toolyard/clickhouse-runtime.env (mode 0600).
# users.d/toolyard.xml reads it via from_env="TOOLYARD_CH_PASSWORD".
# Note: not named CLICKHOUSE_PASSWORD on purpose — that env var triggers
# the image's entrypoint to write its own users.d file, which clashes
# with our read-only mount.
#
# Networking: bound to 127.0.0.1 on the host. The toolyard gateway runs
# on the host and reaches it locally; Grafana will need either a shared
# docker network or a rebind (handled when we wire that up).
#
# Resource caps: 2 GiB memory, 0.5 CPU. CH defaults assume a warehouse
# with dozens of tenants — config.d/toolyard.xml shrinks caches and
# background pools to match a single-user analytics workload.
#
# Bring up:    docker compose -f deploy/clickhouse/docker-compose.yaml up -d
# Tear down:   docker compose -f deploy/clickhouse/docker-compose.yaml down
# Wipe state:  rm -rf /var/lib/toolyard/clickhouse/  (after `down`)

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: toolyard-clickhouse
    restart: unless-stopped
    env_file:
      - /var/lib/toolyard/clickhouse-runtime.env
    ports:
      # Loopback only on the host. Host bindings are in the 1xxxx range
      # so they don't collide with common defaults (Home Assistant on
      # 8123, other tooling on 9000). The toolyard gateway uses these
      # to reach CH; Grafana uses the shared docker network below, so
      # Grafana traffic never crosses the host-port hop.
      #
      # Inside the container CH still listens on 8123/9000 — the LHS of
      # each mapping is the host port, the RHS is the container port.
      - "127.0.0.1:18123:8123"   # HTTP
      - "127.0.0.1:19000:9000"   # native protocol
    networks:
      # Shared with the toolyard-grafana stack so Grafana can resolve
      # `clickhouse:9000`. The network is declared external — created
      # by deploy/install.sh once and owned by neither compose so
      # `down` on either stack can't tear it out from under the other.
      - toolyard_lake_net
    volumes:
      - /var/lib/toolyard/clickhouse/data:/var/lib/clickhouse
      - /var/lib/toolyard/clickhouse/logs:/var/log/clickhouse-server
      - ./config.d:/etc/clickhouse-server/config.d:ro
      - ./users.d:/etc/clickhouse-server/users.d:ro
    ulimits:
      # CH refuses to start without the headroom, even on a small
      # workload. The image documents 262144 as the required floor.
      nofile:
        soft: 262144
        hard: 262144
    # 2 GiB cap. CH's own max_server_memory_usage in config.d sits
    # below this so the OOM killer never has to step in.
    mem_limit: 2g
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /ping is unauthenticated and answers 200 OK once the server is
      # accepting queries. wget ships in the image.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 30s

networks:
  toolyard_lake_net:
    # external: true means this compose won't create or destroy the
    # network — deploy/install.sh creates it idempotently on first run
    # so both this stack and toolyard-grafana can attach.
    external: true
