name: Inbox integration
on:
  pull_request:
  push:
    branches: [t3code/inbox-batch-callbacks]
  # publish-image.yml runs these same tests on main before it publishes.
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    # dev-server-1 uses ARM64; validate and publish a native SQLite-enabled binary.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Go validation
        run: go test ./...
      - name: Code-mode worker sandbox
        # Verbose, so the log shows the runner's Landlock ABI and which
        # sandbox tests ran. The floor makes the tests fail, not skip, if
        # the runner's sandbox drops below Landlock ABI 7 or loses seccomp.
        env:
          TOOLYARD_SANDBOX_TEST_MIN_ABI: "7"
        run: go test -v -count=1 -run TestWorkerSandbox ./internal/codemode/
      - name: Code-mode vet on other platforms
        # The runner is linux/arm64; the sandbox has linux/amd64 and
        # non-Linux files that only these steps compile on a pull request.
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go vet ./internal/codemode/
          GOOS=darwin GOARCH=arm64 go vet ./internal/codemode/
      - name: Dashboard behavior
        run: node --test scripts/*ui.test.cjs
      - name: Build gateway
        run: |
          mkdir -p dist
          go build -ldflags "-X main.version=github-${GITHUB_SHA}" -o dist/toolyard ./cmd/gateway
          go build -o dist/inbox-migration-check ./cmd/inbox-migration-check
      - name: Publish validated application artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolyard-${{ github.sha }}
          path: dist/
          retention-days: 7
  postgres:
    # TEC-1635: the same Go tests on Postgres 16, the engine production
    # moves to at the cutover. storetest gives each test its own database,
    # cloned from a migrated template with C collation. Tests that need a
    # SQLite file (reopen, read-only open, migration upgrades) still run
    # on SQLite here; the schema parity test compares both engines.
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway password for this job's own container.
          POSTGRES_PASSWORD: toolyard-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TOOLYARD_TEST_DB: postgres
      TOOLYARD_TEST_PG_DSN: postgres://postgres:toolyard-ci@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Go validation on Postgres
        run: go test -count=1 ./...
