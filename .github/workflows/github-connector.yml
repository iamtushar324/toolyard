name: GitHub connector
on:
  pull_request:
    paths:
      - 'internal/**'
      - 'cmd/gateway/**'
      - 'web/dashboard/**'
      - 'go.*'
      - '.github/workflows/github-connector.yml'
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'cmd/gateway/**'
      - 'web/dashboard/**'
      - 'go.*'
      - '.github/workflows/github-connector.yml'
permissions:
  contents: read
# Two hosted jobs at most. Do not add deployment or runtime activation here.
concurrency:
  group: connector-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare private contract test directory
        shell: bash
        run: |
          preview_test_tmp="$(mktemp -d "$HOME/bks-preview-ci.XXXXXX")"
          echo "TMPDIR=$preview_test_tmp" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - name: Check formatting and dashboard syntax
        run: |
          test -z "$(gofmt -l internal cmd)"
          node --check web/dashboard/app.js
      - name: Compile the complete module without test execution
        run: go test -p 2 -parallel 2 ./... -run '^$' -timeout=180s
      - name: Test preview identity, gateway, startup, transport and Python contract
        run: |
          go test -p 2 -parallel 2 ./internal/previewassertion -count=1 -timeout=180s -v
          go test -p 2 -parallel 2 ./internal/gateway ./internal/upstreams ./cmd/gateway -run 'Preview|BKSPreview' -count=1 -timeout=180s -v
      - name: Check preview races and immutable enrollment
        run: |
          go test -race -p 2 -parallel 2 ./internal/previewassertion -count=1 -timeout=180s -v
          go test -race -p 2 -parallel 2 ./internal/gateway ./cmd/gateway -run 'Preview|BKSPreview' -count=1 -timeout=180s -v
      - name: Test connector and access boundaries
        run: go test -p 2 -parallel 2 ./internal/githubapi ./internal/gateway ./internal/oauth ./internal/upstreams ./internal/api ./internal/approval ./internal/realtime ./internal/chatnotify -run 'GitHub|RoleGuard|PerUser|UserToken|User.*Refresh|Approval|Export|Actor|Connection|Decide' -count=1 -timeout=180s
      - name: Check GitHub concurrency
        run: go test -race -p 2 -parallel 2 ./internal/githubapi ./internal/gateway ./internal/oauth ./internal/upstreams ./internal/api ./internal/approval -run GitHub -count=1 -timeout=180s
      - name: Build deployment binary
        run: |
          mkdir -p dist
          go build -p 2 -trimpath -ldflags "-s -w -X main.version=github-${GITHUB_SHA}" -o dist/toolyard ./cmd/gateway
          ./dist/toolyard version
      - uses: actions/upload-artifact@v4
        with:
          name: toolyard-github-${{ github.sha }}
          path: dist/toolyard
          retention-days: 7
  preview-darwin:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare private contract test directory
        shell: bash
        run: |
          preview_test_tmp="$(mktemp -d "$HOME/bks-preview-ci.XXXXXX")"
          echo "TMPDIR=$preview_test_tmp" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
      - name: Compile the complete Darwin module without test execution
        run: go test -p 2 -parallel 2 ./... -run '^$' -timeout=180s
      - name: Test Darwin private file and identity contracts
        run: |
          go test -p 2 -parallel 2 ./internal/previewassertion -count=1 -timeout=180s -v
          go test -p 2 -parallel 2 ./cmd/gateway -run BKSPreview -count=1 -timeout=180s -v
